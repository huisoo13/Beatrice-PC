<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>관문 아이콘 시안</title><style>
@font-face{font-family:Pretendard;src:url('../../ui/Beatrice.App/Assets/fonts/Pretendard-Regular.otf')}*{box-sizing:border-box}body{margin:0;background:#252834;color:#F2F3F7;font:14px Pretendard,sans-serif;padding:32px}h1{font-size:20px;margin:0 0 8px}p{color:#AEB4C6;margin:0 0 24px}.list{display:grid;grid-template-columns:repeat(3,minmax(180px,1fr));gap:16px;max-width:960px}.card{padding:24px;background:#22242F;border:1px solid #353949;border-radius:12px}.big{width:84px;height:84px;display:block;margin:4px auto 24px}.states{display:flex;gap:16px;justify-content:center}.button{width:48px;height:48px;display:grid;place-items:center;border:1px solid #353949;border-radius:12px;background:#1B1D26}.button:hover{background:#252834}.button.selected{background:#302B45;border-color:#AB8CFF}.button img{width:28px;height:28px}.muted{filter:grayscale(1);opacity:.8}h2{font-size:16px;margin:24px 0 8px}.note{font-size:12px;line-height:1.5;color:#AEB4C6;margin:0}@media(max-width:650px){.list{grid-template-columns:1fr}}
</style><h1>관문 아이콘</h1><p>단색 SVG · 아이콘 28px · 버튼 48px · 확대 이미지 84px</p><div class="list">
<div class="card"><img class="big" src="arch.svg" alt="아치형 관문"><div class="states"><div class="button"><img class="muted" src="arch.svg" alt="기본"></div><div class="button selected"><img src="arch.svg" alt="선택"></div></div><h2>A · 아치형</h2><p class="note">관문 형태가 가장 바로 읽히는 단순한 형태.</p></div>
<div class="card"><img class="big" src="lintel.svg" alt="기둥형 관문"><div class="states"><div class="button"><img class="muted" src="lintel.svg" alt="기본"></div><div class="button selected"><img src="lintel.svg" alt="선택"></div></div><h2>B · 기둥형</h2><p class="note">각진 기둥과 상단 구조로 차분하고 단단한 인상.</p></div>
<div class="card"><img class="big" src="open.svg" alt="열린 관문"><div class="states"><div class="button"><img class="muted" src="open.svg" alt="기본"></div><div class="button selected"><img src="open.svg" alt="선택"></div></div><h2>C · 열린 문형</h2><p class="note">열린 문을 더해 진입하는 느낌을 살린 형태.</p></div>
</div></html>
